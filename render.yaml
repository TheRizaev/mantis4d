services:
  - type: web
    name: my-flask-app
    runtime: python
    region: frankfurt   # выбери нужный регион
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_ENV
        value: production
      # - key: SECRET_KEY
      #   generateValue: true
